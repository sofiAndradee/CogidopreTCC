version: '3.8'

services:
  aula_nginx:
    image: nginx:alpine
    container_name: aula_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./css:/usr/share/nginx/html/css
      - ./img:/usr/share/nginx/html/img
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro